version: 2

updates:
  - package-ecosystem: pip
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directory: /infra
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    ignore:
      # A new Python minor ships before compiled deps (httptools, uvloop, pydantic-core, ...)
      # publish wheels for it, and the slim image has no compiler. Bump it by hand.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
