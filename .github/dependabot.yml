version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: ci
    # The shared workflows float on @v1; bumping them is the workflows repo's job.
    ignore:
      - dependency-name: neuroticsasquat-ch/workflows
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
    ignore:
      # A new Python minor ships before compiled deps (httptools, uvloop, pydantic-core, ...)
      # publish wheels for it, and the slim image has no compiler. It also has to move together
      # with .python-version, which CI reads. Bump it by hand.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
