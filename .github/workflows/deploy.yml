name: Deploy

# Runs after the `ci` workflow completes on main. That run only concludes `success` when every
# job passed, including `publish`, so the `latest` image deployed here has already been pushed.
# Kept as its own workflow rather than a job in ci.yml so the Azure OIDC grant (`id-token: write`)
# and the Azure secrets never sit in a workflow that runs on every pull request.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Every push to main now deploys (no path filter upstream), so merges in quick succession queue
# here instead of racing for the Tofu state lock. A running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A push run, not a PR run whose head branch happens to be named main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Tofu Init
        working-directory: infra
        run: tofu init -backend-config=backend.hcl

      - name: Tofu Apply
        working-directory: infra
        run: tofu apply -auto-approve

      - name: Get Web App name
        id: infra
        working-directory: infra
        run: echo "webapp_name=$(tofu output -raw web_app_name)" >> "$GITHUB_OUTPUT"

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webapp_name }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
